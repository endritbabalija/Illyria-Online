# Local development config. Production values go in a separate file.
name: wuxia-local
logger:
  level: "DEBUG"
runtime:
  js_entrypoint: "build/index.js"
session:
  token_expiry_sec: 7200 # 2 hours
  refresh_token_expiry_sec: 604800 # 7 days
console:
  max_message_size_bytes: 409600
socket:
  max_message_size_bytes: 4096
  max_request_size_bytes: 131072
